<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funciones JavaScript</title>


</head>
<body>

<div class="contenedor">

    <h1>Funciones en JavaScript</h1>

    <!-- SUMA -->
    <div class="formulario">
        <h3>Suma</h3>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <button onclick="suma()">Calcular</button>
        <div id="resSuma" class="resultado"></div>
    </div>

    <!-- RESTA -->
    <div class="formulario">
        <h3>Resta</h3>
        <input type="number" id="r1" placeholder="Número 1">
        <input type="number" id="r2" placeholder="Número 2">
        <button onclick="resta()">Calcular</button>
        <div id="resResta" class="resultado"></div>
    </div>

    <!-- MULTIPLICACIÓN -->
    <div class="formulario">
        <h3>Multiplicación</h3>
        <input type="number" id="m1" placeholder="Número 1">
        <input type="number" id="m2" placeholder="Número 2">
        <button onclick="multiplicar()">Calcular</button>
        <div id="resMultiplicar" class="resultado"></div>
    </div>

    <!-- DIVISIÓN -->
    <div class="formulario">
        <h3>División</h3>
        <input type="number" id="d1" placeholder="Número 1">
        <input type="number" id="d2" placeholder="Número 2">
        <button onclick="division()">Calcular</button>
        <div id="resDivision" class="resultado"></div>
    </div>

    <!-- ÁREA CÍRCULO -->
    <div class="formulario">
        <h3>Área del Círculo</h3>
        <input type="number" id="radio" placeholder="Radio">
        <button onclick="areaCirculo()">Calcular</button>
        <div id="resCirculo" class="resultado"></div>
    </div>
<div class="formulario">
    <h3>Área del Rectángulo</h3>

    <input type="number" id="base" placeholder="Ingrese la base">

    <input type="number" id="altura" placeholder="Ingrese la altura">

    <button onclick="areaRectangulo()">Calcular</button>

    <div id="resRectangulo" class="resultado"></div>
</div>
    <!-- EDAD -->
    <div class="formulario">
        <h3>Calcular Edad</h3>
        <input type="number" id="anioNacimiento" placeholder="Año de nacimiento">
        <button onclick="calcularEdad()">Calcular</button>
        <div id="resEdad" class="resultado"></div>
    </div>

<div class="formulario">
    <h3>Mayor o Menor de Edad</h3>

    <input type="number" id="edadPersona" placeholder="Ingrese su edad">

    <button onclick="edad()">Verificar</button>

    <div id="resEdad" class="resultado"></div>
</div>


    <div class="formulario">

    <h3>Saludar</h3>

    <input type="text" id="nombreSaludo" placeholder="Ingrese su nombre">

    <button onclick="saludarNombre()">Saludar</button>

    <div id="resSaludo" class="resultado"></div>
</div>


<div class="formulario">
    <h3>Promedio</h3>

    <input type="number" id="nota1" placeholder="Nota 1">
    <input type="number" id="nota2" placeholder="Nota 2">
    <input type="number" id="nota3" placeholder="Nota 3">

    <button onclick="promedio()">Calcular</button>

    <div id="resPromedio" class="resultado"></div>
</div>
<div class="formulario">
    <h3>Número Par</h3>

    <input type="number" id="numeroPar" placeholder="Ingrese un número">

    <button onclick="numPar()">Verificar</button>

    <div id="resPar" class="resultado"></div>
</div>
<div class="formulario">
    <h3>Número Mayor</h3>

    <input type="number" id="numero1" placeholder="Primer número">
    <input type="number" id="numero2" placeholder="Segundo número">

    <button onclick="numMayor()">Comparar</button>

    <div id="resMayor" class="resultado"></div>
</div>
<div class="formulario">
    <h3>Contraseña</h3>

    <input type="password" id="clave" placeholder="Ingrese la contraseña">

    <button onclick="contraseña()">Verificar</button>

    <div id="resClave" class="resultado"></div>
</div>



<div class="formulario">
    <h3>Mostrar Hora</h3>

    <button onclick="mostrarHora()">Mostrar Hora Actual</button>

    <div id="resHora" class="resultado"></div>
</div>


<div class="formulario">
    <h3>Mostrar Nombre</h3>
    <input type="text" id="nombre" placeholder="Ingrese su nombre">
    <button onclick="mostrarNombre()">Mostrar</button>
    <div id="resNombre" class="resultado"></div>
</div>

</div>

</body>
</html>
